services:
  - type: web
    name: rigbooks
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rigbooks-postgres
          property: connectionString
      - key: SESSION_PEPPER
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: MAX_UPLOAD_BYTES
        value: "18000000"

databases:
  - name: rigbooks-postgres
    databaseName: rigbooks
    user: rigbooks
    plan: free
